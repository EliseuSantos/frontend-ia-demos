name: Feature request
description: Suggest an improvement or a new demo
labels: ["enhancement"]
body:
  - type: textarea
    id: idea
    attributes:
      label: Idea
      description: What would you like to see, and what would it teach or show?
    validations:
      required: true
  - type: textarea
    id: approach
    attributes:
      label: Possible approach
  - type: checkboxes
    id: contribute
    attributes:
      label: Contribution
      options:
        - label: I would like to open a pull request for this
